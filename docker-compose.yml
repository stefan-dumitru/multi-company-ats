# Local development services. Credentials come from .env (copy .env.example), never from this file.
# Postgres, Mailpit (a fake mail server that catches every email), and a small S3-compatible
# server that stands in for the resume bucket.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    ports:
      # Bound to localhost only, so the database is not reachable from the network. Host port 5433
      # (not 5432) so it never collides with a Postgres already installed on the machine.
      - "127.0.0.1:5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    # Catches every email the app sends, so nothing real is ever delivered while developing.
    # Read them at http://127.0.0.1:8025. Both ports are bound to localhost only.
    image: axllent/mailpit:v1.33.0
    ports:
      - "127.0.0.1:1025:1025"  # SMTP: where the app sends mail
      - "127.0.0.1:8025:8025"  # web inbox
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 10

  storage:
    # Stands in for the Railway bucket (resume files). MinIO used to be the usual choice but no
    # longer publishes images; the Versity S3 Gateway is a small, maintained S3 server that keeps
    # objects as plain files. The bucket is created when the container starts. Bound to localhost.
    image: ghcr.io/versity/versitygw:v1.11.0
    entrypoint: ["sh", "-c", "mkdir -p /data/$${S3_BUCKET} && exec versitygw posix /data"]
    environment:
      ROOT_ACCESS_KEY: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID in .env}
      ROOT_SECRET_KEY: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY in .env}
      S3_BUCKET: ${S3_BUCKET:?set S3_BUCKET in .env}
    ports:
      - "127.0.0.1:9000:7070"
    volumes:
      - storage-data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 7070"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
  storage-data:
