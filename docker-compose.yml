# Local development services. Credentials come from .env (copy .env.example), never from this file.
# Postgres, and Mailpit (a fake mail server that catches every email). MinIO (resume files) arrives
# with the phase that uses it.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    ports:
      # Bound to localhost only, so the database is not reachable from the network. Host port 5433
      # (not 5432) so it never collides with a Postgres already installed on the machine.
      - "127.0.0.1:5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    # Catches every email the app sends, so nothing real is ever delivered while developing.
    # Read them at http://127.0.0.1:8025. Both ports are bound to localhost only.
    image: axllent/mailpit:v1.33.0
    ports:
      - "127.0.0.1:1025:1025"  # SMTP: where the app sends mail
      - "127.0.0.1:8025:8025"  # web inbox
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
