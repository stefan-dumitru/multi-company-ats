# Checks that must pass before a pull request can merge. The four jobs run in parallel; branch
# protection on `main` requires all of them (set up in Phase 0, step 7).
name: PR checks

on:
  pull_request:

# Least privilege: these jobs only read the repository.
permissions:
  contents: read

# A new push to the same PR cancels the older, now-pointless run.
concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      # A real Postgres, not a mock: migrations and the health checks are tested against it.
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ats
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: ats
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ats -d ats"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # 127.0.0.1, not "localhost": "localhost" can resolve to IPv6 first (see .env.example).
      DATABASE_URL: postgresql+psycopg://ats:ci-only-password@127.0.0.1:5432/ats
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      # ../deploy is the pipeline's own tooling; --config makes it use the same rules as the app.
      - name: Lint
        run: ruff check --config pyproject.toml . ../deploy
      - name: Format check
        run: ruff format --check --config pyproject.toml . ../deploy
      - name: Type check
        run: mypy
      - name: Apply migrations to an empty database
        run: alembic upgrade head
      - name: Tests
        run: pytest

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Type check
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build

  security:
    name: security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: a secret removed in a later commit is still in the history.
          fetch-depth: 0
      - name: Scan for committed secrets (gitleaks)
        # The official image rather than a marketplace action: no extra third-party code or licence.
        run: >-
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1
          git /repo --redact --verbose
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Audit Python dependencies (pip-audit)
        # Runtime requirements only: those are what ships in the image.
        run: |
          pip install pip-audit==2.10.1
          pip-audit -r backend/requirements.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
      - name: Audit frontend dependencies (npm audit)
        working-directory: frontend
        run: npm audit --audit-level=high

  image:
    name: image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build the image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          # Load into the local Docker daemon so the next step can scan it.
          load: true
          tags: ats:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan the image for vulnerabilities (Trivy)
        # Pinned to a commit (v0.36.0), not a tag: tags can be moved, commits cannot.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ats:ci
          # Fail only on serious problems that have a fix available; otherwise a flaw in the base
          # image that nobody can fix yet would block every pull request.
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
