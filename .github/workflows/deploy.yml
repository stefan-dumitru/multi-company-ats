# Runs on every merge to `main`: re-checks the exact commit, builds the image once, and publishes it
# to GitHub's container registry. Later steps of Phase 1 add the staging and production deployments
# to this file.
#
# Triggers ONLY on pushes to main, never on pull requests, so a pull request can never reach the
# secrets this workflow will use to deploy.
name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

# One deployment at a time, and never cancel one that is running: a half-finished deploy is worse
# than a queued one. (If several commits queue up, GitHub keeps only the newest waiting run, which
# is fine: the newest commit contains all the older ones.)
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  checks:
    name: checks
    # The same four jobs that gate pull requests, run again on the commit that will ship.
    uses: ./.github/workflows/pr.yml

  publish:
    name: publish
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # Needed only here, to push the image. No other job can write packages.
      packages: write
    outputs:
      image: ${{ steps.name.outputs.image }}
    steps:
      - uses: actions/checkout@v7
      - name: Work out the image name
        id: name
        # Registry names must be lowercase. The tag is the full commit sha: one image per commit,
        # and the tag says exactly which code it contains.
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - name: Log in to the container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push the image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.name.outputs.image }}
          # Links the package to this repository on GitHub.
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          # A plain image, no attestation manifests: keeps what the hosting platform pulls simple.
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan the published image for vulnerabilities (Trivy)
        # Scans the image as it exists in the registry, i.e. exactly what will be deployed.
        # Pinned to a commit (v0.36.0), not a tag: tags can be moved, commits cannot.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ${{ steps.name.outputs.image }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Summary
        run: |
          {
            echo "### Published image"
            echo '```'
            echo "${{ steps.name.outputs.image }}"
            echo "digest: ${{ steps.build.outputs.digest }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
