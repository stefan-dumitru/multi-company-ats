# Runs on every merge to `main`: re-checks the exact commit, builds the image once, and publishes it
# to GitHub's container registry, deploys that image to Railway staging, and then, after a manual
# approval, the same image to production (restoring the previous version if production fails).
#
# Triggers ONLY on pushes to main, never on pull requests, so a pull request can never reach the
# secrets this workflow will use to deploy.
name: Deploy

on:
  push:
    branches: [main]
  # Manual run, used only to prove the rollback (see simulate_smoke_failure). Environments only
  # accept deployments from `main`, so this cannot ship any other branch.
  workflow_dispatch:
    inputs:
      simulate_smoke_failure:
        description: "TEST ONLY: fail after the production deploy, to prove the automatic rollback"
        type: boolean
        default: false

permissions:
  contents: read

# One deployment at a time, and never cancel one that is running: a half-finished deploy is worse
# than a queued one. (If several commits queue up, GitHub keeps only the newest waiting run, which
# is fine: the newest commit contains all the older ones.)
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  checks:
    name: checks
    # The same four jobs that gate pull requests, run again on the commit that will ship.
    uses: ./.github/workflows/pr.yml

  publish:
    name: publish
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # Needed only here, to push the image. No other job can write packages.
      packages: write
    outputs:
      image: ${{ steps.name.outputs.image }}
    steps:
      - uses: actions/checkout@v7
      - name: Work out the image name
        id: name
        # Registry names must be lowercase. The tag is the full commit sha: one image per commit,
        # and the tag says exactly which code it contains.
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - name: Log in to the container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push the image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.name.outputs.image }}
          # Links the package to this repository on GitHub.
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          # A plain image, no attestation manifests: keeps what the hosting platform pulls simple.
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan the published image for vulnerabilities (Trivy)
        # Scans the image as it exists in the registry, i.e. exactly what will be deployed.
        # Pinned to a commit (v0.36.0), not a tag: tags can be moved, commits cannot.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ${{ steps.name.outputs.image }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Summary
        run: |
          {
            echo "### Published image"
            echo '```'
            echo "${{ steps.name.outputs.image }}"
            echo "digest: ${{ steps.build.outputs.digest }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-staging:
    name: deploy-staging
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Holds the staging secret and variables (RAILWAY_TOKEN, RAILWAY_ENVIRONMENT_ID,
    # RAILWAY_SERVICE_ID, APP_URL). Only `main` may deploy to this environment.
    environment: staging
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Deploy to staging and smoke-test it
        # Railway runs `alembic upgrade head` (its pre-deploy command) before the new version takes
        # traffic. The smoke test starts only after Railway reports this deployment live, so it
        # cannot pass against the old version that is still serving.
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_ENVIRONMENT_ID: ${{ vars.RAILWAY_ENVIRONMENT_ID }}
          RAILWAY_SERVICE_ID: ${{ vars.RAILWAY_SERVICE_ID }}
          APP_URL: ${{ vars.APP_URL }}
        run: python -m deploy.release deploy "${{ needs.publish.outputs.image }}"

  deploy-production:
    name: deploy-production
    needs: [publish, deploy-staging]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # This environment requires a reviewer: the job waits here until it is approved, and only then
    # gets the production secret. Only `main` may deploy to it.
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Deploy to production and smoke-test it
        id: deploy
        # Writes `previous_image` (what was running before) to this step's outputs before changing
        # anything, so the rollback below knows its target even if the deploy fails half way.
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_ENVIRONMENT_ID: ${{ vars.RAILWAY_ENVIRONMENT_ID }}
          RAILWAY_SERVICE_ID: ${{ vars.RAILWAY_SERVICE_ID }}
          APP_URL: ${{ vars.APP_URL }}
        run: python -m deploy.release deploy "${{ needs.publish.outputs.image }}"
      - name: Simulate a failure after the deploy (test only)
        if: inputs.simulate_smoke_failure
        run: |
          echo "::error::Simulated failure: this proves the rollback below, it is not a real problem."
          exit 1
      - name: Roll back to the previous version
        # Runs only when something above failed AND a previous version is known. The step ends the
        # job red either way: the deploy still failed, even if the rollback worked.
        if: failure() && steps.deploy.outputs.previous_image != ''
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_ENVIRONMENT_ID: ${{ vars.RAILWAY_ENVIRONMENT_ID }}
          RAILWAY_SERVICE_ID: ${{ vars.RAILWAY_SERVICE_ID }}
          APP_URL: ${{ vars.APP_URL }}
          PREVIOUS_IMAGE: ${{ steps.deploy.outputs.previous_image }}
        run: python -m deploy.release rollback "$PREVIOUS_IMAGE"
